# FUMA LOUNGE — Nginx для доступа по IP (без домена, HTTP).
# Ставится на ХОСТ (не в контейнер). Проксирует :80 -> 127.0.0.1:3000.
# Приложение при этом НЕ выставлено в интернет напрямую (bind 127.0.0.1).
#
# Установка:
#   sudo apt install -y nginx
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/fuma
#   sudo ln -sf /etc/nginx/sites-available/fuma /etc/nginx/sites-enabled/fuma
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Открой:  http://157.228.136.73

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 15m;

    # Базовая защита: не отдавать версии, ограничить методы.
    server_tokens off;
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
