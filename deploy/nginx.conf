# ─────────────────────────────────────────────────────────────
# FUMA LOUNGE — Nginx reverse proxy (HTTPS via Let's Encrypt)
# Place at /etc/nginx/sites-available/fuma and symlink to sites-enabled.
# Replace menu.example.com with your domain.
# ─────────────────────────────────────────────────────────────

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name menu.example.com;

    # Allow ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name menu.example.com;

    ssl_certificate     /etc/letsencrypt/live/menu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (app also sets its own)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Upload size limit (product photos)
    client_max_body_size 15m;

    # Gzip / compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long-cache Next static assets & uploads
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
